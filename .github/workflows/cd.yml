name: CD

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit and integration tests
        run: npm test

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image_latest: ${{ steps.meta.outputs.image_latest }}
      image_sha: ${{ steps.meta.outputs.image_sha }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image tags and SHA
        id: meta
        run: |
          DOCKER_USER=$(echo "${{ secrets.DOCKERHUB_USERNAME }}" | tr '[:upper:]' '[:lower:]' | xargs)
          if [ -z "$DOCKER_USER" ]; then
            echo "Error: DOCKERHUB_USERNAME está vacío en GitHub Secrets"
            exit 1
          fi
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "image_latest=${DOCKER_USER}/api-libros:latest" >> "$GITHUB_OUTPUT"
          echo "image_sha=${DOCKER_USER}/api-libros:${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image_latest }}
            ${{ steps.meta.outputs.image_sha }}
          build-args: |
            APP_VERSION=${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            IMAGE_LATEST="${{ needs.build-and-push.outputs.image_latest }}"
            IMAGE_SHA="${{ needs.build-and-push.outputs.image_sha }}"
            ENV_FILE="/etc/api-libros/rds.env"

            if [ ! -f "$ENV_FILE" ]; then
              echo "Error: No existe $ENV_FILE en la instancia EC2"
              exit 1
            fi

            echo "Descargando imagen: $IMAGE_SHA"
            docker pull "$IMAGE_SHA"

            echo "Deteniendo y eliminando contenedor anterior (si existe)..."
            docker stop api-libros 2>/dev/null || true
            docker rm api-libros 2>/dev/null || true

            echo "Levantando nuevo contenedor api-libros..."
            docker run -d \
              --name api-libros \
              --restart unless-stopped \
              -p 127.0.0.1:3000:3000 \
              --env-file "$ENV_FILE" \
              "$IMAGE_SHA"

            echo "Limpiando imágenes antiguas sin usar..."
            docker image prune -f || true

            echo "Esperando a que la API responda en /health..."
            for i in $(seq 1 20); do
              if curl -sf http://127.0.0.1:3000/health > /dev/null; then
                echo "API saludable en intento $i"
                break
              fi
              sleep 2
            done

            curl -i http://127.0.0.1:3000/health
            curl -i http://127.0.0.1:3000/libros