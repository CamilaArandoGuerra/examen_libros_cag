name: CD

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image tags and SHA
        id: meta
        run: |
          DOCKER_USER=$(echo "${{ secrets.DOCKERHUB_USERNAME }}" | tr '[:upper:]' '[:lower:]' | xargs)
          if [ -z "$DOCKER_USER" ]; then
            echo "Error: DOCKERHUB_USERNAME está vacío"
            exit 1
          fi
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "image_latest=${DOCKER_USER}/api-libros:latest" >> "$GITHUB_OUTPUT"
          echo "image_sha=${DOCKER_USER}/api-libros:${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.tag_sha }}
            ${{ steps.meta.outputs.tag_latest }}
          build-args: |
            APP_VERSION=${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 with rollback on failure
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            IMAGE_REPO="${{ secrets.DOCKERHUB_USERNAME }}/api-libros"
            NEW_IMAGE="${IMAGE_REPO}:${{ github.sha }}"
            CONTAINER_NAME="api-libros-container"
            ENV_FILE="/etc/api-libros/rds.env"
            PREV_IMAGE_FILE="/etc/api-libros/previous_image.txt"

            if [ ! -f "$ENV_FILE" ]; then
              echo "ERROR: No existe $ENV_FILE en EC2"
              exit 1
            fi

            echo "$DOCKERHUB_TOKEN" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            PREV_IMAGE=""
            if docker inspect "$CONTAINER_NAME" >/dev/null 2>&1; then
              PREV_IMAGE=$(docker inspect --format='{{.Config.Image}}' "$CONTAINER_NAME" || true)
              if [ -n "$PREV_IMAGE" ]; then
                echo "$PREV_IMAGE" > "$PREV_IMAGE_FILE"
              fi
            elif [ -f "$PREV_IMAGE_FILE" ]; then
              PREV_IMAGE=$(cat "$PREV_IMAGE_FILE")
            fi

            docker pull "$NEW_IMAGE"

            docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true

            docker run -d \
              --name "$CONTAINER_NAME" \
              --restart unless-stopped \
              --env-file "$ENV_FILE" \
              -e APP_VERSION="${{ github.sha }}" \
              -p 127.0.0.1:3000:3000 \
              "$NEW_IMAGE"

            sleep 3

            if curl -fsS http://127.0.0.1:3000/health >/dev/null && curl -fsS http://127.0.0.1:3000/libros >/dev/null; then
              echo "Despliegue exitoso de $NEW_IMAGE"
              exit 0
            else
              echo "Fallo en la comprobacion post-despliegue. Restaurando version anterior..."
              docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true
              if [ -n "$PREV_IMAGE" ]; then
                docker pull "$PREV_IMAGE" || true
                docker run -d \
                  --name "$CONTAINER_NAME" \
                  --restart unless-stopped \
                  --env-file "$ENV_FILE" \
                  -p 127.0.0.1:3000:3000 \
                  "$PREV_IMAGE" || true
              fi
              exit 1
            fi
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}